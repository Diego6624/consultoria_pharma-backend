spring.application.name=consultoria_pharma

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/consultoria_pharma_LOCAL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=ConsultoriaPharmaSecretKey2026DebeSerLargaYSeguraMinimo256Bits!!
jwt.expiration-ms=86400000

# --- CORS ---
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Usuario MASTER inicial (solo se crea si no existe) ---
app.master.email=master@consultoria.com
app.master.password=Master123!
app.master.nombre=Administrador Master

# --- Logging ---
logging.level.com.pharma.consultoria_pharma=DEBUG
logging.level.org.springframework.security=INFO
