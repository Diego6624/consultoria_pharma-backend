spring.application.name=consultoria_pharma

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:ConsultoriaPharmaSecretKey2026DebeSerLargaYSeguraMinimo256Bits!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Subida de archivos ---
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-request-header-size=16KB

# --- Usuario MASTER inicial ---
app.master.email=${MASTER_EMAIL:master@consultoria.com}
app.master.password=${MASTER_PASSWORD:Master123!}
app.master.nombre=${MASTER_NOMBRE:Administrador Master}

# --- Perfil activo ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
